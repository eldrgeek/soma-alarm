name: sidekick
description: "Sidekick (Pixel) — calendar alarm + morning routine. User-facing brand: Pulse."
publish_to: 'none'
version: 0.2.9+18

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  workmanager: ^0.9.0+3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  permission_handler: ^11.3.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  provider: ^6.1.2
  flutter_markdown: ^0.7.3
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  image_picker: ^1.1.2
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  crypto: ^3.0.7
  socket_io_client: ^2.0.3+1
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
